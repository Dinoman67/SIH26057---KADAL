services:
  - type: web
    name: kadal-sonarvision
    runtime: python
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
